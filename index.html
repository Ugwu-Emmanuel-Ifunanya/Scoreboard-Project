<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="solo1.css">
    <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
    <title>Scoreboard</title>
</head>
<body>
    <div class="container">
        <div class="team">
            <h3 class="teamName">HOME</h3>
            <div class="box">
                <h1 id="homePoints">0</h1>
            </div>
            <div class="points_adder">
                <button onclick="homeOneP()">+1</button>
                <button onclick="homeTwoP()">+2</button>
                <button onclick="homeThreeP()">+3</button>
            </div>
        </div>
        <div class="team">
            <h3 class="teamName">AWAY</h3>
            <div class="box">
                <h1 id="guestPoints">0</h1>
            </div>
            <div class="points_adder">
                <button onclick="guestOneP()">+1</button>
                <button onclick="guestTwoP()">+2</button>
                <button onclick="guestThreeP()">+3</button>
            </div>
        </div>
    </div>
    <script src="solo1.js"></script>
</body>
</html>
